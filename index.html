<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4">
    <title>trabajo</title>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-6">

    <!--Formulario de contacto-->
    <form action="https://formsubmit.co/subiabrea1010@email.com" method="POST" class="bg-white p-6 rounded-lg shadow-lg max-w-md w-full space-y-4">
        <h2 class="text-2xl font-bold text-gray-800 text-center">Contactanos</h2>

        <!--Nombre-->
        <div>
            <label for="nombre" class="block text-sm font-medium text-gray-700"></label> Nombre
            <input type="text" id="nombre" name="nombre"
            required class="w-full mt-1 border border-gray-400 rounded px-4 py-2 focus:ring-2 focus:ring-indigo-500">
        </div>

        <!--Correo-->
        <div>
            <label for="nombre" class="block text-sm font-medium text-gray-700">Correo Electronico</label>
            <input type="email" id="email" name="email"
            required class="w-full mt-1 border border-gray-400 rounded px-4 py-2 focus:ring-2 focus:ring-indigo-500">
        </div>

        <!--Mensaje-->
        <div> 
            <label for="mensaje" class="block text-sm font-medium text-gray-700">Mensaje</label>
            <textarea name="mensaje" id="mensaje" required rows="4" class="w-full mt-1 border border-gray-400 rounded px-4 py-2 focus:ring-2 focus:ring-indigo-500"></textarea>

            <!--Boton-->
            <button type="submit" class="w-full bg-indigo-600 text-white font-semibold py-2 px-4 rounded hover:bg-indigo-800 transition"> Enviar Correo </button>
        </div>
    </form>
    
</body>
</html>
